<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – VOID X HUB</title>
  <meta name="description" content="Login to your VOID X HUB account.">
  <meta name="robots" content="noindex, nofollow">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body class="bg-void text-gray-100 font-orbitron min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <a href="index.html" class="text-2xl font-black text-cyan-400">VOID<span class="text-purple-400">X</span>HUB</a>
      <p class="text-sm text-gray-400 mt-2">Login to your account</p>
    </div>

    <div class="card p-8">
      <div id="msg" class="hidden mb-4 p-3 rounded-lg text-sm text-center" role="alert"></div>

      <form id="loginForm" class="space-y-5" novalidate>
        <div>
          <label for="username" class="block text-xs font-bold text-cyan-400 mb-2 tracking-wider">USERNAME</label>
          <input type="text" id="username" name="username" required autocomplete="username"
                 class="w-full px-4 py-3 rounded-lg bg-black/40 border-2 border-cyan-500/40 focus:border-cyan-400 focus:outline-none text-sm"
                 placeholder="Enter username">
        </div>
        <div>
          <label for="password" class="block text-xs font-bold text-cyan-400 mb-2 tracking-wider">PASSWORD</label>
          <input type="password" id="password" name="password" required autocomplete="current-password"
                 class="w-full px-4 py-3 rounded-lg bg-black/40 border-2 border-cyan-500/40 focus:border-cyan-400 focus:outline-none text-sm"
                 placeholder="Enter password">
        </div>

        <button type="submit" id="btn"
                class="w-full py-3 bg-gradient-to-r from-cyan-500 to-purple-600 text-black font-bold rounded-lg tracking-wider hover:opacity-90 transition disabled:opacity-60">
          LOGIN
        </button>
      </form>

      <p class="text-center mt-6 text-sm text-gray-400">
        Don't have an account?
        <a href="register.html" class="text-cyan-400 font-bold hover:underline">Register</a>
      </p>
    </div>

    <p class="text-center mt-6">
      <a href="index.html" class="text-sm text-gray-500 hover:text-cyan-400">← Back to Home</a>
    </p>
  </div>

  <script src="js/auth.js"></script>
  <script>
    const API = "https://voidxhub-backend.onrender.com";

    // If already logged in, go to dashboard
    if (getUser()) {
      window.location.href = "dashboard.html";
    }

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("btn");
      const msg = document.getElementById("msg");
      btn.disabled = true;
      btn.textContent = "Logging in...";
      msg.classList.add("hidden");

      try {
        const res = await fetch(API + "/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({
            username: document.getElementById("username").value.trim(),
            password: document.getElementById("password").value
          })
        });
        const data = await res.json();

        if (data.success) {
          setUser(data.user);
          msg.className = "mb-4 p-3 rounded-lg text-sm text-center bg-green-900/40 text-green-400 border border-green-500";
          msg.textContent = "Login successful! Redirecting...";
          msg.classList.remove("hidden");
          setTimeout(() => window.location.href = "dashboard.html", 800);
        } else {
          msg.className = "mb-4 p-3 rounded-lg text-sm text-center bg-red-900/40 text-red-400 border border-red-500";
          msg.textContent = data.message || "Login failed";
          msg.classList.remove("hidden");
          btn.disabled = false;
          btn.textContent = "LOGIN";
        }
      } catch (err) {
        msg.className = "mb-4 p-3 rounded-lg text-sm text-center bg-red-900/40 text-red-400 border border-red-500";
        msg.textContent = "Server error. Please try again.";
        msg.classList.remove("hidden");
        btn.disabled = false;
        btn.textContent = "LOGIN";
      }
    });
  </script>
</body>
</html>
