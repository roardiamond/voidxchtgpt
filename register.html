<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register – VOID X HUB</title>
  <meta name="description" content="Create a VOID X HUB account.">
  <meta name="robots" content="noindex, nofollow">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body class="bg-void text-gray-100 font-orbitron min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <a href="index.html" class="text-2xl font-black text-cyan-400">VOID<span class="text-purple-400">X</span>HUB</a>
      <p class="text-sm text-gray-400 mt-2">Create your account</p>
    </div>

    <div class="card p-8">
      <div id="msg" class="hidden mb-4 p-3 rounded-lg text-sm text-center" role="alert"></div>

      <form id="registerForm" class="space-y-5" novalidate>
        <div>
          <label for="username" class="block text-xs font-bold text-cyan-400 mb-2 tracking-wider">USERNAME</label>
          <input type="text" id="username" name="username" required minlength="3" autocomplete="username"
                 class="w-full px-4 py-3 rounded-lg bg-black/40 border-2 border-cyan-500/40 focus:border-cyan-400 focus:outline-none text-sm"
                 placeholder="Choose a username">
        </div>
        <div>
          <label for="email" class="block text-xs font-bold text-cyan-400 mb-2 tracking-wider">EMAIL</label>
          <input type="email" id="email" name="email" required autocomplete="email"
                 class="w-full px-4 py-3 rounded-lg bg-black/40 border-2 border-cyan-500/40 focus:border-cyan-400 focus:outline-none text-sm"
                 placeholder="your@email.com">
        </div>
        <div>
          <label for="password" class="block text-xs font-bold text-cyan-400 mb-2 tracking-wider">PASSWORD</label>
          <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password"
                 class="w-full px-4 py-3 rounded-lg bg-black/40 border-2 border-cyan-500/40 focus:border-cyan-400 focus:outline-none text-sm"
                 placeholder="Min 8 characters">
        </div>

        <button type="submit" id="btn"
                class="w-full py-3 bg-gradient-to-r from-cyan-500 to-purple-600 text-black font-bold rounded-lg tracking-wider hover:opacity-90 transition disabled:opacity-60">
          CREATE ACCOUNT
        </button>
      </form>

      <p class="text-center mt-6 text-sm text-gray-400">
        Already have an account?
        <a href="login.html" class="text-cyan-400 font-bold hover:underline">Login</a>
      </p>
    </div>

    <p class="text-center mt-6">
      <a href="index.html" class="text-sm text-gray-500 hover:text-cyan-400">← Back to Home</a>
    </p>
  </div>

  <script src="js/auth.js"></script>
  <script>
    const API = "https://voidxhub-backend.onrender.com";

    if (getUser()) {
      window.location.href = "dashboard.html";
    }

    document.getElementById("registerForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("btn");
      const msg = document.getElementById("msg");
      btn.disabled = true;
      btn.textContent = "Creating...";
      msg.classList.add("hidden");

      const username = document.getElementById("username").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (username.length < 3) {
        showError("Username must be at least 3 characters");
        return;
      }
      if (password.length < 8) {
        showError("Password must be at least 8 characters");
        return;
      }

      try {
        const res = await fetch(API + "/api/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ username, email, password })
        });
        const data = await res.json();

        if (data.success) {
          msg.className = "mb-4 p-3 rounded-lg text-sm text-center bg-green-900/40 text-green-400 border border-green-500";
          msg.textContent = "Account created! Redirecting to login...";
          msg.classList.remove("hidden");
          setTimeout(() => window.location.href = "login.html", 1200);
        } else {
          showError(data.message || "Registration failed");
        }
      } catch (err) {
        showError("Server error. Please try again.");
      }

      function showError(text) {
        msg.className = "mb-4 p-3 rounded-lg text-sm text-center bg-red-900/40 text-red-400 border border-red-500";
        msg.textContent = text;
        msg.classList.remove("hidden");
        btn.disabled = false;
        btn.textContent = "CREATE ACCOUNT";
      }
    });
  </script>
</body>
</html>
